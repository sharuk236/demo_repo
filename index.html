<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniShop</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 16px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 { margin: 0; }

    .cart {
      cursor: pointer;
      font-size: 16px;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 8px #ddd;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
    }

    button {
      border: 0;
      padding: 10px 15px;
      background: #111;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover { background: #333; }

    #cart {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>

<body>

  <header>
    <h2>MiniShop</h2>
    <div class="cart">🛒 Cart: <span id="count">0</span></div>
  </header>

  <main class="container">
    <h1>Products</h1>

    <div class="products">

      <div class="product">
        <img src="https://picsum.photos/300/200?1" alt="T-Shirt">
        <h3>T-Shirt</h3>
        <p>₹499</p>
        <button onclick="addToCart('T-Shirt', 499)">Add to Cart</button>
      </div>

      <div class="product">
        <img src="https://picsum.photos/300/200?2" alt="Shoes">
        <h3>Shoes</h3>
        <p>₹1,499</p>
        <button onclick="addToCart('Shoes', 1499)">Add to Cart</button>
      </div>

      <div class="product">
        <img src="https://picsum.photos/300/200?3" alt="Watch">
        <h3>Watch</h3>
        <p>₹999</p>
        <button onclick="addToCart('Watch', 999)">Add to Cart</button>
      </div>

    </div>

    <section id="cart">
      <h2>Your Cart</h2>
      <div id="cartItems">Cart is empty.</div>
      <h3>Total: ₹<span id="total">0</span></h3>
      <button onclick="checkout()">Checkout</button>
    </section>
  </main>

  <script>
    let cart = [];

    function addToCart(name, price) {
      cart.push({ name, price });
      updateCart();
    }

    function updateCart() {
      const items = document.getElementById("cartItems");
      const count = document.getElementById("count");
      const total = document.getElementById("total");

      count.textContent = cart.length;

      if (cart.length === 0) {
        items.innerHTML = "Cart is empty.";
        total.textContent = "0";
        return;
      }

      let sum = 0;

      items.innerHTML = cart.map((item, index) => {
        sum += item.price;

        return `
          <div class="cart-item">
            <span>${item.name} - ₹${item.price}</span>
            <button onclick="removeItem(${index})">Remove</button>
          </div>
        `;
      }).join("");

      total.textContent = sum;
    }

    function removeItem(index) {
      cart.splice(index, 1);
      updateCart();
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
      } else {
        alert("Order placed successfully!");
        cart = [];
        updateCart();
      }
    }
  </script>

</body>
</html>
